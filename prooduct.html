 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP.CO - Product Details</title>
  <link rel="stylesheet" href="prooduct.css">
</head>
 
<body>
    <section class="recommendations">
      <h2>YOU MIGHT ALSO LIKE</h2>
      <div class="product-grid">
        <div class="card">
          <div class="card-image">
            <img src="image/green.jpeg" alt="Polo">
          </div>
          <h3>Polo with Contrast Trims</h3>
          <div class="stars">
            ⭐⭐⭐⭐⭐ <small>4.5</small>
          </div>
          <strong>$212</strong>
          <del>$242</del>
          <span class="discount">-20%</span>
        </div>
        <div class="card">
          <div class="card-image">
            <img src="image/rainb bow.jpeg" alt="T-shirt">
          </div>
          <h3>Gradient Graphic T-shirt</h3>
          <div class="stars">
            ⭐⭐⭐⭐☆ <small>3.5</small>
          </div>
          <strong>$145</strong>
        </div>
        <div class="card">
          <div class="card-image">
            <img src="image/orange.jpeg" alt="Polo">
          </div>
          <h3>Polo with Tipping Details</h3>
          <div class="stars">
            ⭐⭐⭐⭐⭐ <small>4.5</small>
          </div>
          <strong>$180</strong>
        </div>
        <div class="card">
          <div class="card-image">
            <img src="image/white.jpeg" alt="Striped T-shirt">
          </div>
          <h3>Black Striped T-shirt</h3>
          <div class="stars">
            ⭐⭐⭐⭐⭐ <small>5.0</small>
          </div>
          <strong>$120</strong>
          <del>$160</del>
          <span class="discount">-30%</span>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
