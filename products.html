<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP.CO - Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="products.css">
</head>
<body>
        <h1> YOUR CART</h1>
        <section class="cart-layout">
            <div class="cart-items">
                <div class="cart-item">
                    <div class="product-image">
                        <img
                            src="t-shirt.png" alt="Gradient Graphic T-shirt">
                    </div>
                    <div class="product-details">
                        <h3>Gradient Graphic T-shirt</h3>
                        <p> Size:<span> Large </span> </p>
                        <p> Color: <span> White </span> </p>
                        <strong> $145 </strong>
                    </div>
                    <button class="delete"><i class="fa-regular fa-trash-can"></i></button>
                    <div class="quantity">
                        <button> −</button>
                        <span> 1 </span>
                        <button> + </button>
                    </div>
                </div>
                <div class="cart-item">
                    <div class="product-image">
                        <img
                            src="checkered shirt.png" alt="Checkered Shirt">
                    </div>
                    <div class="product-details">
                        <h3>Checkered Shirt </h3>
                        <p>  Size: <span>  Medium  </span>
                        </p>
                        <p> Color:<span> Red  </span></p>
                        <strong>  $180  </strong>
                    </div>
                    <button class="delete"> <i class="fa-regular fa-trash-can"></i></button>
                    <div class="quantity">
                        <button> −</button>
                        <span>  1 </span>
                        <button> + </button>
                    </div>
                </div>
                <div class="cart-item">
                    <div class="product-image">
                        <img src="skinny fit jeans.png"  alt="Skinny Fit Jeans">
                    </div>
                    <div class="product-details">
                        <h3> Skinny Fit Jeans </h3>
                        <p> Size: <span> Large</span></p>
                        <p> Color: <span>  Blue  </span> </p>
                        <strong>    $240  </strong>
                    </div>
                    <button class="delete">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                    <div class="quantity">
                        <button>  −</button>
                        <span>   1  </span>
                        <button>   +</button>
                    </div>
                </div>
            </div>
            <aside class="order-summary">
                <h2>     Order Summary</h2>
                <div class="summary-row">
                    <span>   Subtotal </span>
                    <strong>   $565  </strong>
                </div>
                <div class="summary-row discount">
                    <span>
                        Discount (-20%)
                    </span>
                    <strong>
                        -$113
                    </strong>
                </div>
                <div class="summary-row">
                    <span>
                        Delivery Fee
                    </span>
                    <strong>
                        $15
                    </strong>
                </div>
                <hr>
                <div class="total">
                    <span> Total </span>
                    <strong> $467 </strong>
                </div>
                <div class="promo">
                    <div>
                        <span> 🏷 </span>
                        <input
                            type="text"
                            placeholder="Add promo code" >
                    </div>
                    <button> Apply </button>
                </div>
                <button class="checkout">
                    Go to Checkout
                    <span>  →</span>
                </button>
            </aside>
        </section>
    </main>
</body>

</html>
