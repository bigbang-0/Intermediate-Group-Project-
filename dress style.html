<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Browse By Dress Style</title>

		<!-- Custom Font -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap"
			rel="stylesheet"
		/>

		<!-- Stylesheet -->
		<link rel="stylesheet" href="dress style.css" />
	</head>
	<body>
		<!-- Main Outer Section Frame -->
		<section class="style-section">
			<!-- Title -->
			<h2 class="section-title">BROWSE BY DRESS STYLE</h2>

			<!-- Cards Grid -->
			<div class="cards-grid">
				<!-- 1. Casual  -->
				<a href="#" class="card col-span-1">
					<span class="card-title">Casual</span>
					<img src="image/casual.jpeg" alt="Casual Style" class="card-image image-casual" />
				</a>

				<!-- 2. Formal  -->
				<a href="#" class="card col-span-2">
					<span class="card-title">Formal</span>
					<img src="image/f.jpeg" alt="Formal Style" class="card-image image-formal" />
				</a>

				<!-- 3. Party  -->
				<a href="#" class="card col-span-2">
					<span class="card-title">Party</span>
					<img src="image/party.jpeg" alt="Party Style" class="card-image image-party" />
				</a>

				<!-- 4. Gym  -->
				<a href="#" class="card col-span-1">
					<span class="card-title">Gym</span>
					<img src="image/gym.jpeg" alt="Gym Style" class="card-image image-gym" />
				</a>
			</div>
		</section>
	</body>
</html>
